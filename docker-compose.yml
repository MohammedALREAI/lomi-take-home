# One image for every app service. Only `migrate` builds it (it starts first);
# the others reuse it, so it is built and exported once.
x-app: &app
  image: take-home-app
  pull_policy: never
  env_file:
    # Optional: put GEMINI_API_KEY (and GEMINI_MODEL / GEMINI_FALLBACK_MODEL) here.
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://app:app@postgres:5432/app
    REDIS_URL: redis://redis:6379
    # Test only: EXTRACTOR=rules makes the worker use regex extraction instead
    # of Gemini (CI uses it). Empty by default, which means the real model.
    EXTRACTOR: ${EXTRACTOR:-}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # 5433 on the host so it does not clash with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: applies migrations, then seeds version 1 of the fixtures.
  # Both steps are idempotent, so this runs on every start.
  migrate:
    <<: *app
    build:
      context: .
      target: app
    pull_policy: build
    command: ["pnpm", "--filter", "@app/db", "db:setup"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "apps/api/dist/main.js"]
    restart: unless-stopped
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    restart: unless-stopped
    # Give an in-flight extraction time to stop cleanly on restart.
    stop_grace_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    <<: *app
    working_dir: /app/apps/web
    command: ["node", "node_modules/next/dist/bin/next", "start", "--port", "3000"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
