# Development: only the infrastructure runs in Docker; the apps run on the
# host with `pnpm dev` for instant reloads. Separate project and volume, so
# development data never mixes with the production stack (docker-compose.yml).
# The two use the same host ports: run one or the other.
#
#   pnpm dev:up   # start Postgres + Redis, migrate, seed
#   pnpm dev      # api + worker + web (next dev)
name: take-home-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata-dev:
